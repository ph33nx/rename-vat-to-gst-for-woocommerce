name: Update listing
# Sends .wordpress-org and readme.txt to WordPress.org without a release. Manual only:
#   gh workflow run assets.yml
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    assets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: 10up/action-wordpress-plugin-asset-update@stable
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: rename-vat-to-gst-for-woocommerce
